version: '3.8'  #docker compose 版本
#---------------docker內部網路設定-----------------  
networks:
  core_network: #docker內部網路名稱
    driver: bridge # 支援所有service內部通訊(外部只能透過開放的port)
    
#---------------service設定-----------------    
services: 
  database: # postgre設定
    env_file:
      - .env
    image: postgres:17beta3-alpine3.20 #postgre使用哪個docker image
    container_name: database #設定container名稱
    environment: #會使用到的環境參數
      POSTGRES_USER: ${POSTGRES_USER}   #帳號
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  #密碼
      POSTGRES_DB: ${POSTGRES_DB}  #database name
    ports:
      - "${DBPORT}:${DBPORT}" #對外連線使用5432
    networks:
      - core_network #和docker內部網路連結
    volumes:  #和docker內部和host端的資料夾印射
      - ${PATH_TO_PJOJECT}\line_chatbot\postgres_data:/var/lib/postgresql/data  
    restart: always  #永遠會重啟
    
  main_service: #主要服務的docker
    env_file:
      - .env
    image: lichieh/core:v1.0 
    build: 
      context: ./docker
      dockerfile: ./dockerfile
    container_name: core #設定container名稱
    deploy: 
      resources: #host端硬體資源設定
        reservations: 
          devices: #gpu設定
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes: #和docker內部和host端的資料夾印射
      - ${PATH_TO_PJOJECT}\line_chatbot:/workspace
    networks:
      - core_network  #和docker內部網路連結
    # ports:
    #   - 8001:8001 #對外連線使用8001
    depends_on: # 確保 main_service 啟動後再啟動 NGINX
      - database
    #---------可使用交互介面------------
    stdin_open: true
    tty: true 

  nginx_service:
    env_file:
      - .env
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    volumes:
      - ${PATH_TO_PJOJECT}\line_chatbot\network\nginx.conf:/etc/nginx/nginx.conf
    networks:
      - core_network
    depends_on:
      - main_service
  
  ngrok:
    env_file:
      - .env
    image: wernight/ngrok
    container_name: ngrok
    environment:
      NGROK_AUTH: ${NGROK_AUTH}  # 請在這裡替換為你的 ngrok 授權 token
      NGROK_PORT: "nginx_service:${NGINX_PORT}"  # 將 ngrok 對應到 nginx_service 的 80 端口
    depends_on:
      - nginx_service
    ports:
      - "${NGROK_PORT}:${NGROK_PORT}"
    networks:
      - core_network

  model_server:
    env_file:
      - .env
    image: ollama/ollama:latest
    container_name: ollama
    deploy: 
      resources: #host端硬體資源設定
        reservations: 
          devices: #gpu設定
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ${PATH_TO_PJOJECT}\line_chatbot\models\ollama:/root/.ollama
      - ${PATH_TO_PJOJECT}\line_chatbot\models\gguf:/home
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"
    networks:
      - core_network
    restart: always  #永遠會重啟

  # -----如果你有自己的網域名稱 可以使用 certbot 去做ssl----
